<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808"><title>Ek888 | Login</title>
<style>
:root{color-scheme:dark;--gold:#f2c14e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#30230b,#111 45%,#080808 80%);color:#f8f5ed;font:16px system-ui,sans-serif}header{padding:18px;border-bottom:1px solid #393226;display:flex;justify-content:space-between;gap:10px}.brand{color:var(--gold);font-weight:900;font-size:1.5rem}.tag{color:#bdb7a8;font-size:.8rem}main{width:min(100% - 28px,520px);margin:28px auto}.card{background:#151515;border:1px solid #393226;border-radius:18px;padding:22px;box-shadow:0 16px 45px #0008}h1{margin:0 0 8px}p{color:#bdb7a8;line-height:1.5}.tabs{display:flex;gap:8px;margin:18px 0}button{cursor:pointer;border:0;border-radius:10px;padding:12px 14px;font-weight:750}.tab{flex:1;background:#28251e;color:#eee;border:1px solid #49402e}.tab.active,.primary{background:var(--gold);color:#15110a}label{display:block;margin:14px 0 6px;color:#e9dfc9}input{width:100%;padding:13px 12px;border:1px solid #4b4539;border-radius:10px;background:#0c0c0c;color:white;font-size:1rem}.primary{width:100%;margin-top:18px;font-size:1rem}.message{min-height:24px;font-size:.92rem;margin-top:12px;overflow-wrap:anywhere}.error{color:#ff9e9e}.success{color:#b9f5c7}.hidden{display:none!important}.row{padding:12px 0;border-bottom:1px solid #302b21;overflow-wrap:anywhere}.row b{display:block;color:var(--gold);font-size:.84rem}footer{text-align:center;color:#8e887b;font-size:.8rem;padding:10px 18px 28px}.note{font-size:.8rem}
</style></head><body>
<header><div class="brand">EK888</div><div class="tag">Gaming • Entertainment</div></header>
<main>
<section class="card" id="authCard"><h1>Welcome to Ek888</h1><p>Create an account or log in with your email.</p>
<div class="tabs"><button class="tab active" id="loginTab" type="button">Login</button><button class="tab" id="signupTab" type="button">Sign Up</button></div>
<form id="authForm"><div id="nameWrap" class="hidden"><label for="name">Display name</label><input id="name" autocomplete="name" maxlength="40" placeholder="Your name"></div>
<label for="email">Email address</label><input id="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters">
<button class="primary" id="submitBtn" type="submit">Login</button></form><div id="message" class="message" role="status" aria-live="polite"></div>
<p class="note">Never share your password or verification codes with anyone.</p></section>
<section class="card hidden" id="profileCard"><h1>Your profile</h1><p>You are signed in to Ek888.</p>
<div class="row"><b>Display name</b><span id="profileName">—</span></div><div class="row"><b>Email</b><span id="profileEmail">—</span></div><div class="row"><b>Account ID</b><span id="profileUid">—</span></div>
<button class="primary" id="logoutBtn" type="button">Log out</button><div id="profileMessage" class="message" role="status" aria-live="polite"></div></section>
</main><footer>Ek888 • Account access powered by Firebase Authentication.</footer>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,setPersistence,browserLocalPersistence,createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
// Replace these placeholders with the firebaseConfig values from Firebase Console.
const firebaseConfig={apiKey:"PASTE_API_KEY_HERE",authDomain:"PASTE_PROJECT_ID_HERE.firebaseapp.com",projectId:"PASTE_PROJECT_ID_HERE",storageBucket:"PASTE_STORAGE_BUCKET_HERE",messagingSenderId:"PASTE_MESSAGING_SENDER_ID_HERE",appId:"PASTE_APP_ID_HERE"};
const $=id=>document.getElementById(id), message=$("message"), profileMessage=$("profileMessage");
let mode="login",auth=null;
function msg(el,text,kind=""){el.textContent=text;el.className="message "+kind}
function setMode(m){mode=m;const signup=m==="signup";$("loginTab").classList.toggle("active",!signup);$("signupTab").classList.toggle("active",signup);$("nameWrap").classList.toggle("hidden",!signup);$("name").required=signup;$("password").autocomplete=signup?"new-password":"current-password";$("submitBtn").textContent=signup?"Create account":"Login";msg(message,"")}
$("loginTab").onclick=()=>setMode("login");$("signupTab").onclick=()=>setMode("signup");
function friendly(e){const m={"auth/invalid-email":"Enter a valid email address.","auth/weak-password":"Use at least 6 characters for your password.","auth/email-already-in-use":"This email already has an account. Try Login.","auth/invalid-credential":"Email or password is incorrect.","auth/user-not-found":"No account found. Try Sign Up.","auth/wrong-password":"Email or password is incorrect.","auth/too-many-requests":"Too many attempts. Wait and try again.","auth/network-request-failed":"Network problem. Check your internet.","auth/unauthorized-domain":"Add your GitHub Pages domain to Firebase Authentication authorized domains."};return m[e.code]||"Could not complete this action. Check Firebase settings and try again."}
const incomplete=Object.values(firebaseConfig).some(v=>v.startsWith("PASTE_"));
if(incomplete){msg(message,"Setup needed: replace the firebaseConfig placeholders with your Firebase Web App config.","error");$("submitBtn").disabled=true}
else{try{auth=getAuth(initializeApp(firebaseConfig));await setPersistence(auth,browserLocalPersistence)}catch(e){msg(message,"Firebase configuration error. Check the config values.","error");$("submitBtn").disabled=true}}
$("authForm").addEventListener("submit",async e=>{e.preventDefault();if(!auth)return;$("submitBtn").disabled=true;msg(message,"Please wait…");try{const email=$("email").value.trim(),password=$("password").value;if(mode==="signup"){const displayName=$("name").value.trim();if(!displayName)throw Error("Please enter a display name.");const result=await createUserWithEmailAndPassword(auth,email,password);await updateProfile(result.user,{displayName})}else await signInWithEmailAndPassword(auth,email,password)}catch(e){msg(message,e.code?friendly(e):e.message,"error")}finally{$("submitBtn").disabled=false}});
if(auth)onAuthStateChanged(auth,user=>{if(!user){$("authCard").classList.remove("hidden");$("profileCard").classList.add("hidden");return}$("profileName").textContent=user.displayName||"Not set";$("profileEmail").textContent=user.email||"Not available";$("profileUid").textContent=user.uid;$("authCard").classList.add("hidden");$("profileCard").classList.remove("hidden")});
$("logoutBtn").onclick=async()=>{try{await signOut(auth);msg(profileMessage,"Logged out.","success")}catch(e){msg(profileMessage,friendly(e),"error")}};
</script></body></html>
